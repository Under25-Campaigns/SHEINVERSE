
<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-543ME9KQTB"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  gtag('config', 'G-543ME9KQTB');

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        SHEINVERSE Lead Campus Ambassador Dashboard
    </title>

    <link rel="icon"
          href="assets/favicon.png">

    <link rel="stylesheet"
          href="css/dashboard.css">

</head>

<body>

<div class="background"></div>

<div class="overlay"></div>


<!-- ===================================================== -->
<!-- HEADER -->
<!-- ===================================================== -->

<header>

    <div class="headerLeft">

        <img
            src="assets/logo.png"
            class="logo">

        <div>

            <h1>

                SHEINVERSE Lead Campus Ambassador Dashboard

            </h1>

            <p id="welcomeText">

                Welcome

            </p>

        </div>

    </div>

    <div class="headerRight">

        <button

            class="headerButton"

            onclick="loadDashboard()">

            Refresh

        </button>

        <button

            class="headerButton logout"

            onclick="logout()">

            Logout

        </button>

    </div>

</header>


<!-- ===================================================== -->
<!-- STATS -->
<!-- ===================================================== -->

<section class="statsContainer">

    <div class="statCard">

        <span>

            Campus Ambassadors

        </span>

        <h2 id="totalCA">

            0

        </h2>

    </div>

    <div class="statCard">

        <span>

            Approved Posts

        </span>

        <h2 id="approvedReels">

            0

        </h2>

    </div>

    <div class="statCard">

        <span>

            Pending Posts

        </span>

        <h2 id="pendingReels">

            0

        </h2>

    </div>

    <div class="statCard">

        <span>

            Rejected Posts

        </span>

        <h2 id="rejectedReels">

            0

        </h2>

    </div>

    <div class="statCard">

        <span>

            Referrals

        </span>

        <h2 id="referralCount">

            0

        </h2>

    </div>

</section>


<!-- ===================================================== -->
<!-- SEARCH + ACTIONS -->
<!-- ===================================================== -->

<section class="toolbar">

    <input

        id="searchCA"

        type="text"

        placeholder="Search Campus Ambassador">

    <div class="toolbarButtons">

         <button
            class="primaryButton"
            onclick="openHypeModal()">

            + Add HypeSquad

        </button>
        <button

            class="primaryButton"

            onclick="openCreatorModal()">

            + Add Creator

        </button>

    </div>

</section>


<!-- ===================================================== -->
<!-- CAMPUS AMBASSADORS -->
<!-- ===================================================== -->

<section class="dashboardGroup">

    <div class="dashboardGroupHeader">

        <div>

            <h2 class="dashboardGroupTitle">
                CAs
            </h2>

            <div class="dashboardGroupStats">

                <span id="caSectionCount">
                    0 Campus Ambassadors
                </span>

            </div>

        </div>

    </div>

    <section
        id="caContainer"
        class="creatorContainer">
    </section>

</section>
<!-- ===================================================== -->
<!-- CA CARDS -->
<!-- ===================================================== -->

<section

    id="caContainer"

    class="creatorContainer">

</section>


 <!-- ===================================================== -->
<!-- HYPE SQUAD -->
<!-- ===================================================== -->

<section class="dashboardGroup">

    <div class="dashboardGroupHeader">

        <div>

            <h2 class="dashboardGroupTitle">
                HypeSquad
            </h2>

            <div class="dashboardGroupStats">

                <span id="hypeMemberCount">
                    0 Members
                </span>

                <span>
                    •
                </span>

                <span id="hypeReferralTotal">
                    0 Referrals
                </span>

            </div>

        </div>

    </div>

    <section
        id="hypeContainer"
        class="hypeContainer">
    </section>

</section>
    
<!-- ===================================================== -->
<!-- CREATOR MODAL -->
<!-- ===================================================== -->    

    <div id="creatorModal" class="modal hidden">

    <div class="modalCard">

        <h2>Add Creator</h2>

        <select id="creatorAssignedCA">

            <option value="">
                Select Campus Ambassador
            </option>

        </select>

        <input
            id="creatorName"
            type="text"
            placeholder="Creator Name">

        <input
            id="creatorPhone"
            type="text"
            placeholder="Phone Number">

        <input
            id="creatorEmail"
            type="email"
            placeholder="Email Address">

        <input
            id="creatorInstagram"
            type="text"
            placeholder="Instagram Username">

        <input
            id="creatorFollowers"
            type="number"
            placeholder="Followers">

        <div class="modalButtons">

            <button
                class="secondaryButton"
                onclick="closeCreatorModal()">

                Cancel

            </button>

            <button
                id="addCreatorButton"
                class="primaryButton"
                onclick="addCreator()">

                Add Creator

            </button>

        </div>

    </div>

</div>


<!-- ===================================================== -->
<!-- ADD HYPE SQUAD MODAL -->
<!-- ===================================================== -->

<div
    id="hypeModal"
    class="modal hidden">

    <div class="modalCard">

        <h2>

            Add Hype Squad Member

        </h2>

        <input
            id="hypeName"
            type="text"
            placeholder="Name">

        <input
            id="hypePhone"
            type="text"
            placeholder="Phone Number">

        <input
            id="hypeEmail"
            type="email"
            placeholder="Email Address">

        <p
            id="hypeError"
            class="formError">
        </p>

        <div class="modalButtons">

            <button
                class="secondaryButton"
                onclick="closeHypeModal()">

                Cancel

            </button>

            <button
                id="addHypeButton"
                class="primaryButton"
                onclick="addHypeSquad()">

                Add HypeSquad

            </button>

        </div>

    </div>

</div>

<!-- ===================================================== -->
<!-- TEMPLATE -->
<!-- ===================================================== -->

<template id="caTemplate">

    <div class="creatorCard">

        <div

            class="creatorHeader"

            onclick="toggleCA(this)">

            <div>

                <h3 class="caName">

                </h3>

                <div class="caStats">

                </div>

            </div>

            <span class="expandIcon">

                ▼

            </span>

        </div>

        <div class="creatorBody">

            <div

                class="creatorList">

            </div>

        </div>

    </div>

</template>


<!-- ===================================================== -->
<!-- APPROVE / REJECT MODAL -->
<!-- ===================================================== -->

<div
    id="approvalModal"
    class="modal hidden">

    <div class="modalCard">

        <h2>

            Post Review

        </h2>

        <p id="approvalMessage">

            Approve or reject this post?

        </p>

        <div class="modalButtons">

            <button
                class="secondaryButton"
                onclick="closeApprovalModal()">

                Cancel

            </button>

            <button
                class="primaryButton"
                onclick="approveCurrentReel()">

                Approve

            </button>

            <button
                class="secondaryButton"
                onclick="rejectCurrentReel()">

                Reject

            </button>

        </div>

    </div>

</div>


<script src="js/config.js"></script>

<script src="js/dashboard-lca.js"></script>

</body>

</html>
