<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-KHQ2EGNPCZ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-KHQ2EGNPCZ');
</script>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SHEINVERSE Campus Ambassador Dashboard</title>

    <link rel="icon"
          href="assets/favicon.png">

    <link rel="stylesheet"
          href="css/dashboard.css">

</head>

<body>

<div class="background"></div>

<div class="overlay"></div>


<!-- ========================================= -->
<!-- HEADER -->
<!-- ========================================= -->

<header>

    <div class="headerLeft">

        <img src="assets/logo.png"
             class="logo">

        <div>

            <h1>

                SHEINVERSE Campus Ambassador Dashboard

            </h1>

            <p id="welcomeText">

                Welcome

            </p>

        </div>

    </div>

    <div class="headerRight">

        <button
            class="headerButton"
            onclick="loadDashboard()">

            Refresh

        </button>

        <button
            class="headerButton logout"
            onclick="logout()">

            Logout

        </button>

    </div>

</header>



<!-- ========================================= -->
<!-- STATS -->
<!-- ========================================= -->

<!-- ===================================================== -->
<!-- STATS -->
<!-- ===================================================== -->

<section class="statsContainer">

    <div class="statCard">

        <span>
            Total Creators
        </span>

        <h2 id="totalCreators">
            0
        </h2>

    </div>

    <div class="statCard">

        <span>
            Reel 1
        </span>

        <h2 id="reel1Count">
            0
        </h2>

    </div>

    <div class="statCard">

        <span>
            Reel 2
        </span>

        <h2 id="reel2Count">
            0
        </h2>

    </div>

    <div class="statCard">

        <span>
            Referrals
        </span>

        <h2 id="referralCount">
            0
        </h2>

    </div>

</section>


<!-- ========================================= -->
<!-- TOOLBAR -->
<!-- ========================================= -->

<section class="toolbar">

    <input
        id="searchCreators"
        type="text"
        placeholder="Search Creator">

    <div class="toolbarButtons">

        <button
            class="primaryButton"
            onclick="openOrderModal()">

            Submit Order

        </button>

        <button
            class="primaryButton"
            onclick="openCreatorModal()">

            + Add Creator

        </button>

    </div>

</section>


<!-- ========================================= -->
<!-- CREATOR CARDS -->
<!-- ========================================= -->

<section
    id="creatorContainer"
    class="creatorContainer">

</section>



<!-- ========================================= -->
<!-- ADD CREATOR MODAL -->
<!-- ========================================= -->

<div
    id="creatorModal"
    class="modal hidden">

    <div class="modalCard">

        <h2>

            Add New Creator

        </h2>

        <input
            id="creatorName"
            type="text"
            placeholder="Creator Name">

        <input
            id="creatorPhone"
            type="text"
            placeholder="Phone Number">

        <input
            id="creatorEmail"
            type="email"
            placeholder="Email Address">

        <input
            id="creatorInstagram"
            type="text"
            placeholder="Instagram Username">

        <input
            id="creatorFollowers"
            type="number"
            placeholder="Followers">

        <p
            id="creatorError"
            class="formError">

        </p>

        <div class="modalButtons">

            <button
                class="secondaryButton"
                onclick="closeCreatorModal()">

                Cancel

            </button>

            <button
                id="addCreatorButton"
                class="primaryButton"
                onclick="addCreator()">

                Add Creator

            </button>

        </div>

    </div>

</div>

<!-- ========================================= -->
<!-- ORDER SUBMISSION MODAL -->
<!-- ========================================= -->

<div id="orderModal" class="modal hidden">

    <div class="modalCard">

        <h2>

            Submit SHEIN Order

        </h2>

        <select id="orderCreator">

            <option value="">

                Select Creator

            </option>

        </select>

        <input
            id="orderID"
            type="text"
            placeholder="Order ID">

        <div class="file-upload">

            <input
                id="orderScreenshot"
                type="file"
                accept=".png,.jpg,.jpeg,image/png,image/jpeg"
                hidden
                onchange="updateFileName(this)">

            <label
                for="orderScreenshot"
                class="choose-file-btn">

                📷 Choose Screenshot

            </label>

            <span id="selectedFileName">

                No file selected

            </span>

        </div>

        <div class="modalButtons">

            <button
                class="secondaryButton"
                onclick="closeOrderModal()">

                Cancel

            </button>

            <button
                id="submitOrderButton"
                class="primaryButton"
                onclick="submitOrder()">

                Submit Order

            </button>

        </div>

    </div>

</div>



<!-- ===================================================== -->
<!-- SUBMIT REEL MODAL -->
<!-- ===================================================== -->

<div
    id="reelModal"
    class="modal hidden">

    <div class="modalCard">

        <h2 id="reelTitle">
            Submit Reel
        </h2>

        <input
            id="reelLink"
            type="text"
            placeholder="Instagram Reel Link">

        <div class="modalButtons">

            <button
                class="secondaryButton"
                onclick="closeReelModal()">

                Cancel

            </button>

            <button
                id="submitReelButton"
                class="primaryButton"
                onclick="submitReel()">

                Submit Reel

            </button>

        </div>

    </div>

</div>


<!-- ========================================= -->
<!-- CREATOR TEMPLATE -->
<!-- ========================================= -->

<template id="creatorTemplate">

    <div class="creatorCard">

        <div
            class="creatorHeader"
            onclick="toggleCreator(this)">

            <div>

                <h3 class="creatorName">

                </h3>

                <a
                    class="creatorInstagram"
                    target="_blank">

                </a>

            </div>

            <span class="expandIcon">

                ▼

            </span>

        </div>

        <div class="creatorBody">

            <div class="reelRow reel1">

            </div>

            <div class="reelRow reel2">

            </div>

            <div class="reelRow reel3">

            </div>

        </div>

    </div>

</template>



<script src="js/config.js"></script>

<script src="js/dashboard-ca.js"></script>

</body>

</html>
